name: Octopus 🐙

on:
  schedule:
    # Poll hourly — GitHub throttles */5 to ~2-4h anyway.
    # Invite/close are determined by Boston wall-clock time inside Python,
    # so the cron only needs to run often enough to catch the 9am window.
    - cron: "0 * * * *"

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      command:
        description: "Command: auto | invite | poll | close | ping"
        required: true
        default: "auto"
      ping_user:
        description: "For ping: Slack user ID or full name to DM"
        required: false
        default: ""

jobs:
  octopus:
    runs-on: ubuntu-latest

    # Built-in token for checkout + state push; never expires (replaces GH_PAT)
    permissions:
      contents: write

    concurrency:
      group: octopus
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install slack-sdk

      - name: Determine command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          else
            echo "command=auto" >> $GITHUB_OUTPUT
          fi

      - name: Run Octopus
        env:
          SLACK_BOT_TOKEN:      ${{ secrets.SLACK_BOT_TOKEN }}
          PI_SLACK_USER_ID:     ${{ secrets.PI_SLACK_USER_ID }}
          KATIE_SLACK_USER_ID:  ${{ secrets.KATIE_SLACK_USER_ID }}
          PING_USER:            ${{ github.event.inputs.ping_user }}
        run: |
          cd src
          python octopus.py ${{ steps.cmd.outputs.command }}

      - name: Save state back to repo
        run: |
          git config user.name  "Octopus Bot"
          git config user.email "octopus-bot@jazlab.mit.edu"
          git add src/octopus_state.json
          git diff --cached --quiet || git commit -m "chore: update octopus state [skip ci]"
          git push
